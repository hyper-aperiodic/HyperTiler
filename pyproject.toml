[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypertiler"
version = "1.0.0"
description = "A friendly low/no-code tool for generating quasiperiodic tilings"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sam Coates", email = "coates92@liverpool.ac.uk" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "PyQt5==5.15.11",
    "pyqtgraph==0.14.0",
    "numpy==2.5.2",
    "scipy==1.18.1",
]

[project.urls]
Homepage = "https://github.com/hyper-aperiodic/0.0"

[project.gui-scripts]
hypertiler = "hypertiler.__main__:main"

[tool.setuptools.packages.find]
include = ["hypertiler*"]
