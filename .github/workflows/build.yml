name: Build executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: hypertiler-windows
          - os: ubuntu-22.04
            artifact_name: hypertiler-linux
          - os: macos-latest
            artifact_name: hypertiler-macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PyInstaller's splash screen needs tkinter on the build machine; the
      # spec skips the splash entirely on macOS (unsupported there), so only
      # Linux needs this - Windows/macOS setup-python builds already bundle it.
      - name: Install tkinter (Linux splash-screen dependency)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller hypertiler.spec --noconfirm --clean

      - name: Package build output
        shell: bash
        run: tar -czf "${{ matrix.artifact_name }}.tar.gz" -C dist hypertiler

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.tar.gz
