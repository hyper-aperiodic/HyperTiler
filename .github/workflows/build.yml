name: Build executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: hypertiler-windows
            dist_path: dist/hypertiler
          - os: ubuntu-22.04
            artifact_name: hypertiler-linux
            dist_path: dist/hypertiler
          - os: macos-latest
            artifact_name: hypertiler-macos
            # BUNDLE() in the spec wraps the onedir output into a proper
            # .app on macOS - that's the shippable artifact there, not the
            # raw dist/hypertiler folder Windows/Linux produce.
            dist_path: dist/HyperTiler.app
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PyInstaller's splash screen needs tkinter on the build machine; the
      # spec skips the splash entirely on macOS (unsupported there), so only
      # Linux needs this - Windows/macOS setup-python builds already bundle it.
      - name: Install tkinter (Linux splash-screen dependency)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install xcb runtime libraries (Linux Qt platform plugin dependency)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxkbcommon-x11-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller packaging/hypertiler.spec --noconfirm --clean

      - name: Smoke-test the .app launches
        if: runner.os == 'macOS'
        run: |
          open dist/HyperTiler.app
          sleep 5
          # Check the process is still alive (didn't crash on launch)
          if ! pgrep -f HyperTiler > /dev/null; then
            echo "App failed to stay running"
            exit 1
          fi
          pkill -f HyperTiler || true
      - name: Check code signature / Gatekeeper status
        if: runner.os == 'macOS'
        run: spctl -a -vvv -t execute dist/HyperTiler.app || true

      # upload-artifact zips whatever `path` points to on its own when you
      # download it from the Actions UI - archiving it ourselves first would
      # just nest one zip/tar inside the other for no reason.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.dist_path }}
